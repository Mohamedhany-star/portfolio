<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="AWS Cloud Architecture Diagram — Highly Available Web Application">
  <defs>
    <linearGradient id="gradBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="gradSlate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="gradTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="gradSky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="gradGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" rx="16" fill="#0b1120"/>

  <text x="500" y="32" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">AWS Cloud Architecture — Highly Available Web Application</text>
  <text x="500" y="50" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748b">Elastic compute · Scalable · Fault-tolerant · IAM least privilege</text>

  <text x="40" y="92" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">EXTERNAL / SUPPORT SERVICES</text>

  <!-- Users -->
  <rect x="40" y="110" width="230" height="64" rx="12" fill="url(#gradSlate)" stroke="rgba(255,255,255,0.12)"/>
  <text x="155" y="136" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Users / Clients</text>
  <text x="155" y="155" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#94a3b8">HTTPS requests</text>

  <!-- Internet Gateway -->
  <rect x="40" y="250" width="230" height="64" rx="12" fill="url(#gradTeal)" stroke="rgba(255,255,255,0.12)"/>
  <text x="155" y="276" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Internet Gateway</text>
  <text x="155" y="295" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#d1fae5">Route in / out</text>

  <!-- S3 -->
  <rect x="40" y="400" width="230" height="64" rx="12" fill="url(#gradSky)" stroke="rgba(255,255,255,0.12)"/>
  <text x="155" y="426" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Amazon S3 — Static Assets</text>
  <text x="155" y="445" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#e0f2fe">Bucket + backups</text>

  <!-- IAM -->
  <rect x="40" y="520" width="230" height="64" rx="12" fill="url(#gradPurple)" stroke="rgba(255,255,255,0.12)"/>
  <text x="155" y="546" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">AWS IAM</text>
  <text x="155" y="565" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#ede9fe">Least-privilege policies</text>

  <!-- VPC -->
  <rect x="360" y="60" width="600" height="530" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="7 5" opacity="0.7"/>
  <text x="932" y="92" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">Amazon VPC — 2 Availability Zones (AZ-A / AZ-B)</text>
  <text x="380" y="120" font-family="Inter, Arial, sans-serif" font-size="11" fill="#7dd3fc">Public subnets</text>

  <!-- ALB -->
  <rect x="400" y="250" width="520" height="64" rx="12" fill="url(#gradBlue)" stroke="rgba(255,255,255,0.12)"/>
  <text x="660" y="276" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Application Load Balancer</text>
  <text x="660" y="295" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#dbeafe">Listeners · Target groups</text>

  <!-- Private subnets -->
  <text x="380" y="345" font-family="Inter, Arial, sans-serif" font-size="11" fill="#7dd3fc">Private subnets</text>

  <!-- EC2 A -->
  <rect x="420" y="360" width="240" height="64" rx="12" fill="url(#gradSky)" stroke="rgba(255,255,255,0.12)"/>
  <text x="540" y="386" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">EC2 Web Server — AZ-A</text>
  <text x="540" y="405" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#e0f2fe">Auto Scaling Group</text>

  <!-- EC2 B -->
  <rect x="700" y="360" width="240" height="64" rx="12" fill="url(#gradSky)" stroke="rgba(255,255,255,0.12)"/>
  <text x="820" y="386" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">EC2 Web Server — AZ-B</text>
  <text x="820" y="405" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#e0f2fe">Scales with demand</text>

  <!-- RDS Primary -->
  <rect x="420" y="490" width="240" height="64" rx="12" fill="url(#gradGreen)" stroke="rgba(255,255,255,0.12)"/>
  <text x="540" y="516" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">RDS MySQL — Primary (AZ-A)</text>
  <text x="540" y="535" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#d1fae5">Private subnet</text>

  <!-- RDS Standby -->
  <rect x="700" y="490" width="240" height="64" rx="12" fill="url(#gradGreen)" stroke="rgba(255,255,255,0.12)"/>
  <text x="820" y="516" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">RDS MySQL — Standby (AZ-B)</text>
  <text x="820" y="535" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#d1fae5">Multi-AZ failover</text>

  <!-- Arrows -->
  <line x1="155" y1="174" x2="155" y2="250" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="282" x2="400" y2="282" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="314" x2="540" y2="360" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="314" x2="820" y2="360" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="424" x2="540" y2="490" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="424" x2="820" y2="490" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="522" x2="700" y2="522" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- S3 route (dashed) -->
  <line x1="270" y1="432" x2="400" y2="432" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="335" y="422" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="9" fill="#94a3b8">static</text>
</svg>